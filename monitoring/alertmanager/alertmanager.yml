global:
  resolve_timeout: 5m
  smtp_smarthost: "mail.cmgp-cas.ma:465"
  smtp_from: "alerte-data-integrations@cmgp-cas.ma"
  smtp_auth_username: "alerte-data-integrations@cmgp-cas.ma"
  smtp_auth_password: "Ti{3BWe3^ndk=,.9"
  smtp_require_tls: false

route:
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "email-ops"

  routes:
    - match:
        severity: critical
      receiver: "email-ops"
      repeat_interval: 4h

receivers:
  - name: "email-ops"
    email_configs:
      - to: "y.elasry@cmgp-cas.ma"
        send_resolved: true
        headers:
          subject: >
            [{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}
            — Service: {{ .GroupLabels.service }}
        html: |
          <html>
          <body style="font-family:Arial,sans-serif;color:#333;">
            <h2 style="color:{{ if eq .Status "firing" }}#c0392b{{ else }}#27ae60{{ end }}">
              🔔 {{ .Status | toUpper }} — {{ .GroupLabels.alertname }}
            </h2>
            {{ range .Alerts }}
            <hr>
            <p><strong>Service :</strong> {{ .Labels.service }}</p>
            <p><strong>Sévérité :</strong> {{ .Labels.severity }}</p>
            <p><strong>Résumé :</strong> {{ .Annotations.summary }}</p>
            <p><strong>Détail :</strong> {{ .Annotations.description }}</p>
            <p><strong>Début :</strong> {{ .StartsAt.Format "2006-01-02 15:04:05" }}</p>
            {{ end }}
            <hr>
            <p style="font-size:11px;color:gray;">
              Alerte générée automatiquement par Alertmanager.
            </p>
          </body>
          </html>

inhibit_rules:
  - source_match:
      alertname: "ImpayesSyncServiceDown"
    target_match:
      alertname: "ImpayesConsecutiveFailures"
      service: "impayes"
    equal: ["service"]
